# Render Blueprint for project-server (New > Blueprint, pick this repository).
# Values marked sync: false are asked for on the first deploy; copy them from project-server/.env.local.
services:
  - type: web
    name: project-server
    runtime: node
    plan: free
    rootDir: project-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_STORE_NAME
        sync: false
      - key: SHOPIFY_ADMIN_API_PASSWORD
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-10
      - key: ALLOWED_ORIGINS
        sync: false
      - key: THEME_SECRET
        sync: false
      - key: RECAPTCHA_SECRET
        sync: false
